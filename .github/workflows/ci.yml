name: Validate Tater Bench

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python and benchmark suite
        run: |
          python -m compileall -q taterbench tests
          python -m unittest discover -s tests -v
          python -m taterbench validate-suite core
      - name: Verify generated reports
        run: |
          python -m taterbench report
          git diff --exit-code -- RESULTS.md docs/results.json docs/index.html
